<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Учись и играй">
<meta name="theme-color" content="#7A9B5C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Учись и играй</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2E8D5;--card:#FBF6EC;--green:#7A9B5C;--green-dark:#5A7A42;--green-light:#DCEACF;--text:#3A3128;--soft:#7A6F60;--peach:#E8A87C;--sh:0 2px 4px rgba(90,70,50,.06),0 6px 14px rgba(90,70,50,.08);--txt-base:17px;--txt-prompt:20px;--txt-opt:30px;--txt-opt-text:18px;--txt-letter:140px;--txt-word:30px;--txt-title:22px}
body.theme-dark{--bg:#2C2A26;--card:#3A3732;--text:#EDE8DC;--soft:#A9A196;--sh:0 2px 4px rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.3)}
body.fs-small{--txt-base:15px;--txt-prompt:18px;--txt-opt:26px;--txt-opt-text:15px;--txt-letter:110px;--txt-word:26px;--txt-title:20px}
body.fs-large{--txt-base:20px;--txt-prompt:24px;--txt-opt:36px;--txt-opt-text:21px;--txt-letter:160px;--txt-word:36px;--txt-title:26px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'M PLUS Rounded 1c',-apple-system,system-ui,sans-serif;background:radial-gradient(circle at 20% 30%,rgba(200,180,150,.10) 0,transparent 40%),radial-gradient(circle at 80% 70%,rgba(180,160,130,.08) 0,transparent 40%),var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:16px 16px 150px;user-select:none;font-size:var(--txt-base);line-height:1.45;font-weight:500;transition:background .3s,color .3s}
#app{width:100%;max-width:720px}
.hd{display:flex;align-items:center;gap:8px;padding:8px 4px 20px}
.hd h1{font-size:var(--txt-title);font-weight:800;flex:1;position:relative;display:inline-block;padding-bottom:4px}
.hd h1 .uline{position:absolute;left:0;right:35%;bottom:-2px;height:6px;color:var(--green);opacity:.6;pointer-events:none}
.hd h1 .uline svg{width:100%;height:100%;display:block}
.ib{background:var(--card);border:none;width:48px;height:48px;border-radius:16px 14px 17px 15px;cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.ib svg{width:24px;height:24px}.ib:active{transform:scale(.94)}
.ib-txt{font-size:22px;line-height:1}
.bdg{background:var(--card);padding:6px 14px;border-radius:999px;font-weight:700;box-shadow:var(--sh);display:flex;gap:6px;align-items:center;font-size:16px;height:48px}
.bdg img{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tl{background:var(--card);border:none;border-radius:24px 20px 26px 22px;padding:16px 10px;font-family:inherit;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;box-shadow:var(--sh);transition:transform .15s;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:140px;justify-content:center;position:relative;overflow:hidden}
.tl::before{content:'';position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--green);opacity:.25}
.tl::after{content:'';position:absolute;bottom:8px;left:8px;width:4px;height:4px;border-radius:50%;background:var(--peach);opacity:.3}
.tl:active{transform:scale(.96)}
.tlic{width:66px;height:66px;border-radius:50% 48% 52% 50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;overflow:hidden}
.tlic img{width:56px;height:56px}
.lt{display:flex;align-items:center;gap:8px;padding-bottom:16px}
.bb{background:var(--card);border:none;width:48px;height:48px;border-radius:16px 14px 17px 15px;cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bb svg{width:22px;height:22px}.bb svg path{stroke:var(--text)}
.pg{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dt{width:11px;height:11px;border-radius:50%;background:rgba(128,128,128,.25);transition:all .2s}
.dt.dn{background:var(--green)}.dt.cu{background:var(--green-dark);transform:scale(1.3)}
.qc{background:var(--card);border-radius:28px 24px 30px 26px;padding:24px 18px;box-shadow:var(--sh);text-align:center;margin-bottom:18px;position:relative}
.qc::before,.qc::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.2}
.qc::before{top:12px;left:14px}.qc::after{bottom:12px;right:14px;background:var(--peach)}
.vs{min-height:90px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px}
.vs .pic{display:inline-block}.vs .pic svg,.vs .pic img{display:block}
.pm{font-size:var(--txt-prompt);font-weight:700}.pm .word{color:var(--green-dark)}
.op{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.bt{background:var(--card);border:3px solid transparent;border-radius:24px 20px 26px 22px;padding:20px 10px;font-family:inherit;font-size:var(--txt-opt);font-weight:700;color:var(--text);cursor:pointer;box-shadow:var(--sh);transition:transform .12s,border-color .15s,background .15s;min-height:105px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;hyphens:auto;overflow-wrap:anywhere;line-height:1.15}
.bt.bt-text{font-size:var(--txt-opt-text);padding:14px 8px;min-height:90px}
.bt:active{transform:scale(.96)}
.bt.correct{background:var(--green-light);border-color:var(--green);animation:pp .3s}
.bt.wrong{animation:sk .4s;border-color:var(--peach)}
.bt svg{width:70px;height:70px}.bt img{width:70px;height:70px;object-fit:contain}
.shadow-svg svg,.shadow-svg img{filter:brightness(0) saturate(100%);opacity:.7}
body.theme-dark .shadow-svg svg,body.theme-dark .shadow-svg img{filter:brightness(0) invert(1) opacity(.85)}
@keyframes pp{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lc{background:var(--card);border-radius:28px 24px 30px 26px;padding:30px 20px;box-shadow:var(--sh);text-align:center;margin-bottom:20px}
.ll{font-size:var(--txt-letter);font-weight:800;color:var(--green);line-height:1;margin-bottom:8px}
.lw{font-size:var(--txt-word);font-weight:700;color:var(--text);margin-bottom:16px}
.lp{display:flex;justify-content:center;margin-bottom:4px}.lp img{width:130px;height:130px;object-fit:contain}
.rw{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(242,232,213,.88);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
body.theme-dark .rw{background:rgba(44,42,38,.9)}.rw.show{opacity:1}
.rwi{background:var(--card);border-radius:32px 28px 34px 30px;padding:36px 44px;text-align:center;box-shadow:0 12px 40px rgba(90,70,50,.18);animation:pp .35s;transform:rotate(-1.5deg)}
.rws{width:76px;height:76px;margin:0 auto}.rws img{width:100%;height:100%}
.rwt{font-size:24px;font-weight:800;margin-top:10px;color:var(--green-dark)}
.fn{text-align:center;padding:40px 20px}
.fe{width:120px;height:120px;margin:0 auto}.fe img{width:100%;height:100%;object-fit:contain}
.ft{font-size:28px;font-weight:800;margin:14px 0 6px}
.fs{color:var(--soft);margin-bottom:26px;font-size:18px}
.bp{background:var(--green);color:white;border:none;border-radius:20px 17px 22px 19px;padding:16px 34px;font-family:inherit;font-size:19px;font-weight:700;cursor:pointer;box-shadow:var(--sh)}
.bp:active{transform:scale(.96)}
.bs{background:var(--card);color:var(--text);border:none;border-radius:20px 17px 22px 19px;padding:14px 26px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.sb{background:var(--card);border-radius:22px 20px 24px 21px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.sl{font-size:14px;font-weight:700;color:var(--soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vl{display:flex;flex-direction:column;gap:8px}
.vo{padding:14px 16px;border-radius:14px 12px 15px 13px;background:rgba(128,128,128,.1);border:2px solid transparent;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;text-align:left;color:var(--text);display:flex;align-items:center;gap:10px;width:100%}
.vo.active{background:var(--green-light);border-color:var(--green)}
.vo .vi{font-size:20px}.vo .vd{font-size:13px;color:var(--soft);font-weight:500}
.sw{width:58px;height:34px;border-radius:999px;background:rgba(128,128,128,.35);border:none;cursor:pointer;position:relative;padding:0;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:white;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(24px)}
input[type=range]{width:100%;accent-color:var(--green)}
input[type=text],textarea{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:rgba(128,128,128,.08);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-weight:600;outline:none;transition:border .2s}
input[type=text]:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.rr{display:flex;align-items:center;gap:12px;margin-top:4px}
.rr span{font-size:14px;color:var(--soft);font-weight:600}
.size-row{display:flex;gap:8px}
.size-btn{flex:1;background:rgba(128,128,128,.1);border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer;font-family:inherit;font-weight:800;color:var(--text);text-align:center}
.size-btn.s1{font-size:14px}.size-btn.s2{font-size:18px}.size-btn.s3{font-size:22px}
.size-btn.active{background:var(--green-light);border-color:var(--green)}
.color-row{display:flex;gap:10px}
.color-dot{flex:1;aspect-ratio:1;max-width:56px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.color-dot.active{border-color:var(--text);transform:scale(1.08)}
.color-dot.g{background:#7A9B5C}.color-dot.b{background:#5B7FB8}.color-dot.p{background:#D97A9B}.color-dot.v{background:#8B6DB5}
.story-card{background:var(--card);border-radius:28px 24px 30px 26px;padding:32px 24px;box-shadow:var(--sh);text-align:center;margin-bottom:20px}
.story-card .story-pic{width:130px;height:130px;margin:0 auto 16px}
.story-card .story-pic img{width:100%;height:100%;object-fit:contain}
.story-card .story-text{font-size:20px;font-weight:700;line-height:1.5}
#helper{position:fixed;right:14px;bottom:96px;width:96px;height:96px;z-index:5;pointer-events:none;transition:bottom .2s}
#helper img{width:100%;height:100%;display:block;object-fit:contain}
#helper.idle{animation:idl 3s ease-in-out infinite}
#helper.jump{animation:jp .6s ease}
#helper.tilt{animation:tl .8s ease}
@keyframes idl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes jp{0%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes tl{0%,100%{transform:rotate(0)}40%{transform:rotate(-9deg)}70%{transform:rotate(4deg)}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -4px 16px rgba(90,70,50,.12);border-top:1px solid rgba(128,128,128,.12);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:100;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0}
body.theme-dark .bottom-nav{box-shadow:0 -4px 16px rgba(0,0,0,.4);border-top-color:rgba(255,255,255,.06)}
.nav-item{flex:1;background:none;border:none;cursor:pointer;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--soft);font-family:inherit;font-size:12px;font-weight:700;transition:color .2s,transform .2s;border-radius:12px}
.nav-item:active{transform:scale(.94)}
.nav-item.active{color:var(--green)}
.nav-item .nav-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.nav-item .nav-ic svg{width:26px;height:26px;stroke:currentColor}
.profile-avatar{width:96px;height:96px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:42px;font-weight:800;color:var(--green-dark);overflow:hidden}
.profile-avatar img{width:70%;height:70%;object-fit:contain}
.profile-name{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.profile-sub{text-align:center;color:var(--soft);font-size:15px;margin-bottom:22px}
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:var(--card);border-radius:18px;padding:16px 10px;box-shadow:var(--sh);text-align:center}
.stat-box .sb-num{font-size:26px;font-weight:800;color:var(--green-dark);line-height:1}
.stat-box .sb-lbl{font-size:12px;color:var(--soft);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.3px}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:none;border-radius:18px;padding:16px 18px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;color:var(--text);text-align:left;transition:transform .12s}
.menu-item:active{transform:scale(.98)}
.menu-item .mi-icon{width:36px;height:36px;border-radius:12px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.menu-item .mi-arrow{margin-left:auto;color:var(--soft);font-size:18px}
.about-text{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--sh);line-height:1.6;font-size:16px}
.about-text p{margin-bottom:12px}.about-text p:last-child{margin-bottom:0}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:white;padding:12px 24px;border-radius:16px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:200;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"><div id="screen"></div></div>
<div id="helper" class="idle"></div>
<div class="rw" id="reward"><div class="rwi"><div class="rws" id="rewardStar"></div><div class="rwt" id="rewardText">Молодец!</div></div></div>
<div class="bottom-nav" id="bottomNav"></div>
<div class="toast" id="toast"></div>
<script>
const CDN='https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/';
const ic={
apple:CDN+'1f34e.svg',banana:CDN+'1f34c.svg',grapes:CDN+'1f347.svg',watermelon:CDN+'1f349.svg',
house:CDN+'1f3e0.svg',cat:CDN+'1f431.svg',dog:CDN+'1f436.svg',ball:CDN+'26bd.svg',

lemon:CDN+'1f34b.svg',mushroom:CDN+'1f344.svg',fir:CDN+'1f332.svg',beetle:CDN+'1f41e.svg',

penguin:CDN+'1f427.svg',tiger:CDN+'1f42f.svg',duck:CDN+'1f986.svg',flag:CDN+'1f6a9.svg',

sock:CDN+'1f9e6.svg',cup:CDN+'2615.svg',mitten:CDN+'1f9e4.svg',shoe:CDN+'1f45f.svg',
hedgehog:CDN+'1f994.svg',hedgehogBig:CDN+'1f994.svg',confetti:CDN+'1f389.svg',appleSmall:CDN+'1f34e.svg',

rainbow:CDN+'1f308.svg',umbrella:CDN+'2602.svg',cloud:CDN+'2601.svg',droplet:CDN+'1f4a7.svg',

happy:CDN+'1f60a.svg',sad:CDN+'1f622.svg',angry:CDN+'1f620.svg',surprised:CDN+'1f62e.svg',
scared:CDN+'1f628.svg',sleepy:CDN+'1f634.svg',heart:CDN+'2764.svg',
plus:CDN+'2795.svg',minus:CDN+'2796.svg',
teddy:CDN+'1f9f8.svg',cake:CDN+'1f382.svg',candy:CDN+'1f36c.svg',
gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',

homeIcon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>',

};
function ss(n,s){var v=ic[n];if(!v)return'';if(v.charAt(0)==='<'){return v.replace('<svg ','<svg style="width:'+s+'px;height:'+s+'px;display:block" ');}return '<img src="'+v+'" alt="" style="width:'+s+'px;height:'+s+'px;display:block;object-fit:contain">';}
function pc(n,s){s=s||60;return '<span class="pic">'+ss(n,s)+'</span>';}
function mn(n,c,s){s=s||40;var o='';for(var i=0;i<c;i++)o+=pc(n,s);return o;}
function bg(n){return ss(n,120);}
function ci(c){return '<svg viewBox="0 0 60 60" style="width:80px;height:80px"><circle cx="30" cy="30" r="26" fill="'+c+'"/></svg>';}
function sh(n){return '<span class="shadow-svg pic">'+ss(n,110)+'</span>';}
 
const COLORS={

function buildABQ(){
  var p=AB.slice(),pi=[],u={};
  while(pi.length<6&&Object.keys(u).length<p.length){
    var i=Math.floor(Math.random()*p.length);
    if(u[i])continue;u[i]=1;pi.push(p[i]);
  }
  return pi.map(function(it){
    var o=p.filter(function(x){return x.l!==it.l}),wr=[];
    while(wr.length<2){var w=o[Math.floor(Math.random()*o.length)];if(wr.indexOf(w.l)===-1)wr.push(w.l);}
    var op=[it.l,wr[0],wr[1]].sort(function(){return Math.random()-.5});
    return{prompt:'На какую букву начинается слово <span class="word">«'+it.w+'»</span>?',speak:'На какую букву начинается слово '+it.w+'?',visual:bg(it.p),options:op,correct:op.indexOf(it.l)};
  });
}

const ST={

function saveST(){
  localStorage.setItem('soundOn',ST.soundOn);
  localStorage.setItem('voiceURI',ST.voiceURI);
  localStorage.setItem('voiceRate',ST.rate);
  localStorage.setItem('voicePitch',ST.pitch);
  localStorage.setItem('apples',ST.apples);
  localStorage.setItem('theme',ST.theme);
  localStorage.setItem('colorTheme',ST.colorTheme);

  localStorage.setItem('userName',ST.userName);

function applyTheme(){
  var body=document.body;
  body.classList.toggle('theme-dark',ST.theme==='dark');
  body.classList.remove('fs-small','fs-medium','fs-large');
  body.classList.add('fs-'+ST.fontSize);
  var c=COLORS[ST.colorTheme]||COLORS.green;
  var root=document.documentElement;
  root.style.setProperty('--green',c.main);
  root.style.setProperty('--green-dark',ST.theme==='dark'?c.main:c.dark);
  root.style.setProperty('--green-light',ST.theme==='dark'?c.dlight:c.light);
  var tc=document.querySelector('meta[name="theme-color"]');
  if(tc)tc.setAttribute('content',c.main);
}

function loadVC(){if(!('speechSynthesis' in window))return;const a=speechSynthesis.getVoices();const r=a.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('ru')===0);VC=r.length?r:a;if(SN==='settings')renderST();}
if('speechSynthesis' in window){loadVC();window.speechSynthesis.onvoiceschanged=loadVC;}
function say(t){
  if(!ST.soundOn)return;
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ru-RU';u.rate=ST.rate;u.pitch=ST.pitch;
    if(ST.voiceURI){const v=VC.find(v=>v.voiceURI===ST.voiceURI);if(v)u.voice=v;}
    speechSynthesis.speak(u);
  }catch(e){}
}

  return '<button class="bt" data-i="'+i+'">'+o.html+'</button>';

  sh2('<div class="lt"><button class="bb" id="backBtn">'+ic.arrowLeft+'</button><div class="pg">'+qs.map(function(_,i){return '<span class="dt '+(i<S.qIndex?'dn':'')+' '+(i===S.qIndex?'cu':'')+'"></span>';}).join('')+'</div><div class="bdg">'+ss('appleSmall',26)+' '+ST.apples+'</div></div><div class="qc">'+(q.visual?'<div class="vs">'+q.visual+'</div>':'')+'<div class="pm">'+q.prompt+'</div></div><div class="op" id="options">'+q.options.map(optHtml).join('')+'</div>');
  SC.querySelector('#backBtn').addEventListener('click',renderHome);
  SC.querySelectorAll('.bt').forEach(b=>b.addEventListener('click',()=>chooseA(+b.dataset.i,b)));
  if(q.speak)setTimeout(()=>say(q.speak),300);
}
 
function chooseA(i,b){
  if(S.locked)return;
  var qs=getQs(),q=qs[S.qIndex];
  if(i===q.correct){
    S.locked=true;
    b.classList.add('correct');
    ha('jump');
    var w=KW[Math.floor(Math.random()*KW.length)];
    showRW(w);say(w);
    setTimeout(function(){
      hideRW();S.qIndex++;S.locked=false;
      if(S.qIndex>=qs.length){
        ST.apples++;saveST();
        var t='Урок';
        if(S.lessonKey==='alphabetTest')t='Алфавит';
        else if(LS[S.lessonKey])t=LS[S.lessonKey].title;
        finish(t);
      }else renderQ();
    },1100);
  }else{
    b.classList.add('wrong');
    ha('tilt');
    if(ST.soundOn)say('Попробуй ещё');
    setTimeout(()=>b.classList.remove('wrong'),500);
  }
}

    '<div class="stat-row">'+
      '<div class="stat-box"><div class="sb-num">'+ST.apples+'</div><div class="sb-lbl">Яблочек</div></div>'+
      '<div class="stat-box"><div class="sb-num">'+Object.keys(CT).length+'</div><div class="sb-lbl">Разделов</div></div>'+
      '<div class="stat-box"><div class="sb-num">'+AB.length+'</div><div class="sb-lbl">Букв</div></div>'+
    '</div>'+
    '<button class="menu-item" id="nameBtn"><span class="mi-icon">✏️</span><span>Имя ребёнка</span><span class="mi-arrow">›</span></button>'+
    '<button class="menu-item" id="feedbackBtn"><span class="mi-icon">💬</span><span>Отзыв или вопрос</span><span class="mi-arrow">›</span></button>'+
    '<button class="menu-item" id="aboutBtn"><span class="mi-icon">💛</span><span>О проекте</span><span class="mi-arrow">›</span></button>'+
    '<button class="menu-item" id="settingsBtn"><span class="mi-icon">⚙️</span><span>Настройки</span><span class="mi-arrow">›</span></button>'
  );
  SC.querySelector('#nameBtn').addEventListener('click',renderNameForm);
  SC.querySelector('#feedbackBtn').addEventListener('click',renderFeedbackForm);
  SC.querySelector('#aboutBtn').addEventListener('click',renderAbout);
  SC.querySelector('#settingsBtn').addEventListener('click',renderST);
}
 
function renderNameForm(){
  SN='nameForm';
  var v=ST.userName.replace(/"/g,'&quot;');
  sh2(
    '<div class="lt"><button class="bb" id="backBtn">'+ic.arrowLeft+'</button><h1 style="flex:1;font-size:22px;font-weight:800">Имя ребёнка</h1></div>'+
    '<div class="sb"><div class="sl">Как зовут ребёнка?</div><input type="text" id="nameInput" placeholder="Например, Маша" maxlength="20" value="'+v+'"><div style="font-size:13px;color:var(--soft);margin-top:8px">Имя будет показано на главном экране. Хранится только на этом устройстве.</div></div>'+
    '<button class="bp" id="saveName" style="width:100%">Сохранить</button>'
  );
  SC.querySelector('#backBtn').addEventListener('click',renderProfile);
  SC.querySelector('#saveName').addEventListener('click',function(){
    var val=SC.querySelector('#nameInput').value.trim();
    ST.userName=val;saveST();showToast('Имя сохранено');renderProfile();
  });
}
 
function renderFeedbackForm(){
  SN='feedbackForm';
  sh2(
    '<div class="lt"><button class="bb" id="backBtn">'+ic.arrowLeft+'</button><h1 style="flex:1;font-size:20px;font-weight:800">Отзыв или вопрос</h1></div>'+
    '<div class="sb"><div class="sl">Что бы вы хотели сказать?</div><textarea id="fbText" placeholder="Напишите отзыв, вопрос или пожелание..."></textarea></div>'+
    '<div class="sb"><div class="sl">Ваше имя или email (необязательно)</div><input type="text" id="fbContact" placeholder="Как с вами связаться?"></div>'+
    '<button class="bp" id="sendFb" style="width:100%">Отправить</button>'+
    '<div style="font-size:13px;color:var(--soft);margin-top:14px;text-align:center;line-height:1.5">Сейчас сообщение сохранится только на этом устройстве. Скоро подключим отправку.</div>'
  );
  SC.querySelector('#backBtn').addEventListener('click',renderProfile);
  SC.querySelector('#sendFb').addEventListener('click',function(){
    var t=SC.querySelector('#fbText').value.trim();
    if(!t){showToast('Напишите что-нибудь');return;}
    localStorage.setItem('feedback_'+Date.now(),JSON.stringify({text:t,contact:SC.querySelector('#fbContact').value.trim(),date:new Date().toISOString()}));
    showToast('Спасибо! Ваш отзыв сохранён');
    setTimeout(renderProfile,1200);
  });
}
 
function renderAbout(){
  SN='about';
  sh2(
    '<div class="lt"><button class="bb" id="backBtn">'+ic.arrowLeft+'</button><h1 style="flex:1;font-size:22px;font-weight:800">О проекте</h1></div>'+
    '<div class="sb"><div class="about-text">'+
      '<p><b>«Учись и играй»</b> — приложение для детей 4–7 лет, созданное с особой заботой о детях с расстройствами аутистического спектра.</p>'+
      '<p>Здесь нет резких звуков, миганий и проигрышей. Все задания повторяются в одном и том же спокойном порядке — чтобы ребёнку было понятно и не тревожно.</p>'+
      '<p>Ёжик — добрый помощник, который радуется вместе с ребёнком и никогда не ругает за ошибки.</p>'+
      '<p>Приложение бесплатное, работает без рекламы. Мы верим, что учиться можно с интересом и без стресса.</p>'+
      '<p>Если у вас есть идеи или замечания — загляните в раздел «Отзыв или вопрос». Мы читаем всё.</p>'+
    '</div></div>'
  );
  SC.querySelector('#backBtn').addEventListener('click',renderProfile);
}
 
function renderST(){
  SN='settings';
  var list=VC.length
    ? VC.map(function(v,i){return '<button class="vo '+(ST.voiceURI===v.voiceURI?'active':'')+'" data-vi="'+i+'"><span class="vi">🔊</span><span><span style="display:block">'+v.name+'</span><span class="vd">'+v.lang+'</span></span></button>';}).join('')
    : '<div style="color:var(--soft);font-size:14px">Голоса ещё не загрузились. Открой в Chrome или Safari.</div>';
 
  sh2(
    '<div class="lt"><button class="bb" id="setBack">'+ic.arrowLeft+'</button><h1 style="flex:1;font-size:22px;font-weight:800">Настройки</h1></div>'+
    '<div class="sb"><div class="sr"><div><div style="font-weight:800;font-size:17px">Озвучивание</div><div style="font-size:14px;color:var(--soft)">Голосом читать слова и вопросы</div></div><button class="sw '+(ST.soundOn?'on':'')+'" id="soundSwitch"></button></div></div>'+
    '<div class="sb"><div class="sl">Размер текста</div><div class="size-row"><button class="size-btn s1 '+(ST.fontSize==='small'?'active':'')+'" data-fs="small">Аа</button><button class="size-btn s2 '+(ST.fontSize==='medium'?'active':'')+'" data-fs="medium">Аа</button><button class="size-btn s3 '+(ST.fontSize==='large'?'active':'')+'" data-fs="large">Аа</button></div></div>'+
    '<div class="sb"><div class="sl">Цвет приложения</div><div class="color-row"><button class="color-dot g '+(ST.colorTheme==='green'?'active':'')+'" data-color="green"></button><button class="color-dot b '+(ST.colorTheme==='blue'?'active':'')+'" data-color="blue"></button><button class="color-dot p '+(ST.colorTheme==='pink'?'active':'')+'" data-color="pink"></button><button class="color-dot v '+(ST.colorTheme==='purple'?'active':'')+'" data-color="purple"></button></div></div>'+
    '<div class="sb"><div class="sr"><div><div style="font-weight:800;font-size:17px">Тёмная тема</div><div style="font-size:14px;color:var(--soft)">Спокойнее для глаз вечером</div></div><button class="sw '+(ST.theme==='dark'?'on':'')+'" id="themeSwitch"></button></div></div>'+
    '<div class="sb"><div class="sl">Голос</div><div class="vl" id="voiceList">'+list+'</div></div>'+
    '<div class="sb"><div class="sl">Скорость речи: '+ST.rate.toFixed(2)+'×</div><input type="range" id="rateRange" min="0.5" max="1.3" step="0.05" value="'+ST.rate+'"><div class="rr"><span>Медленно</span><span style="flex:1"></span><span>Быстрее</span></div></div>'+
    '<div class="sb"><div class="sl">Высота голоса: '+ST.pitch.toFixed(2)+'</div><input type="range" id="pitchRange" min="0.8" max="1.8" step="0.05" value="'+ST.pitch+'"><div class="rr"><span>Обычный</span><span style="flex:1"></span><span>Мультяшный</span></div></div>'+
    '<div class="sb"><div class="sr"><div><div style="font-weight:800;font-size:17px">Сбросить яблочки</div><div style="font-size:14px;color:var(--soft)">Сейчас собрано: '+ST.apples+'</div></div><button class="bs" id="resetBtn">Сбросить</button></div></div>'+
    '<button class="bp" id="testVoice" style="width:100%;margin-top:4px">Проверить голос</button>'
  );
 
  SC.querySelector('#setBack').addEventListener('click',function(){
    if(S.tab==='profile')renderProfile();else renderHome();
  });
  SC.querySelector('#soundSwitch').addEventListener('click',function(e){
    ST.soundOn=!ST.soundOn;saveST();
    e.currentTarget.classList.toggle('on',ST.soundOn);
    if(!ST.soundOn&&'speechSynthesis' in window)speechSynthesis.cancel();
  });
  SC.querySelector('#themeSwitch').addEventListener('click',function(e){
    ST.theme=ST.theme==='dark'?'light':'dark';saveST();
    e.currentTarget.classList.toggle('on',ST.theme==='dark');
    applyTheme();
  });
  SC.querySelectorAll('.size-btn').forEach(b=>b.addEventListener('click',function(){
    ST.fontSize=b.dataset.fs;saveST();applyTheme();renderST();
  }));
  SC.querySelectorAll('.color-dot').forEach(b=>b.addEventListener('click',function(){
    ST.colorTheme=b.dataset.color;saveST();applyTheme();renderST();
  }));
  SC.querySelectorAll('.vo').forEach(b=>b.addEventListener('click',function(){
    var i=+b.dataset.vi;
    if(VC[i])ST.voiceURI=VC[i].voiceURI;
    saveST();renderST();
    setTimeout(()=>say('Привет! Я буду читать задания.'),250);
  }));
  var rr=SC.querySelector('#rateRange');
  rr.addEventListener('input',function(){
    ST.rate=parseFloat(rr.value);
    rr.closest('.sb').querySelector('.sl').textContent='Скорость речи: '+ST.rate.toFixed(2)+'×';
    saveST();
  });
  rr.addEventListener('change',()=>say('Так будет читаться задание'));
  var pr=SC.querySelector('#pitchRange');
  pr.addEventListener('input',function(){
    ST.pitch=parseFloat(pr.value);
    pr.closest('.sb').querySelector('.sl').textContent='Высота голоса: '+ST.pitch.toFixed(2);
    saveST();
  });
  pr.addEventListener('change',()=>say('Так будет звучать голос'));
  SC.querySelector('#resetBtn').addEventListener('click',function(){
    if(confirm('Сбросить все яблочки?')){ST.apples=0;saveST();renderST();}
  });
  SC.querySelector('#testVoice').addEventListener('click',()=>say('Привет! Давай учиться и играть!'));
 
  if(VC.length===0&&'speechSynthesis' in window){
    setTimeout(function(){loadVC();},400);
  }
}
 
applyTheme();
renderNav();
renderHome();
</script>
</body>
</html>
